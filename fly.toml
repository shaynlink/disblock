# Disblock API and bot runtime.
# Keep exactly one machine: every bot holds its gateway connection in this
# process, so a second machine would answer each event twice.
app = "disblock-api"
primary_region = "cdg"
kill_signal = "SIGTERM"
kill_timeout = "30s"

[env]
  PORT = "8080"
  RUST_LOG = "info"
  SENTRY_ENVIRONMENT = "production"

[deploy]
  strategy = "rolling"
  # Schema changes run once, as the owner role in MIGRATION_DATABASE_URL,
  # before new machines start. The app role cannot alter the schema.
  release_command = "migrate"

[http_service]
  internal_port = 8080
  force_https = true
  # Bots must stay connected to Discord, so the machine never sleeps.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

  [http_service.concurrency]
    type = "requests"
    soft_limit = 200
    hard_limit = 250

  [[http_service.checks]]
    grace_period = "15s"
    interval = "15s"
    timeout = "5s"
    method = "GET"
    path = "/api/health"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
