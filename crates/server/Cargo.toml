[package]
name = "disblock-server"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
disblock-program.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
aes-gcm = "0.11.1"
axum = "0.8.9"
axum-extra = { version = "0.12.6", features = ["cookie"] }
base64 = "0.23.1"
hex = "0.4.3"
rand = "0.10.4"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "form", "rustls-no-provider"] }
ring = "0.17.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
sentry = { version = "0.49.6", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls-no-provider", "tracing", "logs", "metrics", "tower", "tower-http", "tower-axum-matched-path"] }
governor = "0.10.4"
sha2 = "0.11"
sqlx = { version = "0.9.1", default-features = false, features = ["runtime-tokio", "tls-rustls-ring-webpki", "postgres", "macros", "migrate", "uuid", "time", "json"] }
time = { version = "0.3.55", features = ["serde", "formatting", "parsing"] }
tokio-util = "0.7"
tokio = { version = "1.54.1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower-http = { version = "0.7.1", features = ["trace", "limit"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
twilight-gateway = { version = "0.18.0", default-features = false, features = ["rustls-webpki-roots", "zstd", "twilight-http"] }
twilight-http = { version = "0.18.0", default-features = false, features = ["rustls-webpki-roots", "decompression"] }
twilight-model = "0.18.0"
twilight-util = { version = "0.18.0", features = ["builder"] }
uuid = { version = "1.29.3", features = ["v4", "serde"] }
