[workspace]
resolver = "3"
members = ["crates/program", "crates/server"]

[workspace.package]
edition = "2024"
license = "UNLICENSED"
publish = false

[workspace.dependencies]
disblock-program = { path = "crates/program" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1"
thiserror = "2.0.21"

[profile.release]
lto = "thin"
codegen-units = 1
# Keep file and line tables so Sentry stack traces of the server are readable.
debug = "line-tables-only"
strip = "none"
